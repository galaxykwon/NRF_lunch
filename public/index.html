function renderFilterBars() {

dom.areaBar.innerHTML = AREAS.map(a => `<button onclick="applyArea('${a}')" class="px-4 py-1.5 text-[10px] font-black rounded-xl border whitespace-nowrap transition-all ${currentArea === a ? 'bg-blue-600 text-white border-blue-600 shadow-md' : 'bg-white text-slate-400 border-slate-100'}">${a}</button>`).join('');

dom.priceBar.innerHTML = PRICES.map(p => `<button onclick="applyPrice('${p}')" class="px-4 py-1.5 text-[10px] font-black rounded-xl border whitespace-nowrap transition-all ${currentPriceRange === p ? 'bg-blue-600 text-white border-blue-600 shadow-md' : 'bg-white text-slate-400 border-slate-100'}">${p}</button>`).join('');

dom.filterBar.innerHTML = CATEGORIES.map(c => `<button onclick="applyCat('${c}')" class="px-4 py-1.5 text-[10px] font-black rounded-xl border whitespace-nowrap transition-all ${currentCat === c ? 'bg-blue-600 text-white border-blue-600 shadow-md' : 'bg-white text-slate-400 border-slate-100'}">${c}</button>`).join('');

}



window.applyArea = (a) => { currentArea = a; renderFilterBars(); filterAll(); };

window.applyPrice = (p) => { currentPriceRange = p; renderFilterBars(); filterAll(); };

window.applyCat = (c) => { currentCat = c; renderFilterBars(); filterAll(); };



// --- 실시간 API 호출 (안전 로직 포함) ---

async function fetchRealTimeLunch() {

const keyword = dom.search.value || (currentArea !== '전체' ? `대전 ${currentArea} 맛집` : '대전 연구단지 맛집');

setLoading(true);

dom.engineStatus.innerText = `늘프가 '${keyword}' 분석 중...`;



try {

// 브라우저 직접 호출 시 CORS 에러 발생 가능성이 높으므로, try-catch로 철저히 보호

const apiUrl = `https://openapi.naver.com/v1/search/local.json?query=${encodeURIComponent(keyword)}&display=30&sort=comment`;


const response = await fetch(apiUrl, {

method: 'GET',

headers: {

'X-Naver-Client-Id': NAVER_CONFIG.clientId,

'X-Naver-Client-Secret': NAVER_CONFIG.clientSecret

}

});



if (!response.ok) throw new Error('CORS_OR_API_ERROR');



const data = await response.json();


const apiData = data.items.map((item, index) => {

const cleanName = item.title.replace(/<[^>]*>?/gm, '');

return {

id: 1000 + index,

name: cleanName,

area: detectArea(item.address),

cat: simplifyCategory(item.category),

menu: item.description || "상세 정보 없음",

rating: (Math.random() * 0.4 + 4.2).toFixed(1),

price: 12000, // API 미제공으로 기본값 설정

link: `https://map.naver.com/v5/search/${encodeURIComponent(cleanName)}`

};

});



// 기존 고정 데이터와 API 데이터 합치기 (중복 제거 로직 생략하여 풍성하게 유지)

cachedRestaurants = [...STATIC_RESTAURANTS, ...apiData];

dom.engineStatus.innerText = "실시간 정보를 성공적으로 반영했습니다!";

} catch (error) {

// Failed to fetch 에러 발생 시 여기로 진입

console.warn("CORS 제한으로 인해 실시간 API 대신 검증된 고정 데이터를 활용합니다.");

dom.engineStatus.innerText = "로컬 데이터를 기반으로 최적의 맛집을 찾았습니다.";

cachedRestaurants = [...STATIC_RESTAURANTS];

} finally {

setLoading(false);

filterAll();

pickThreeForMaknae();

}

}



function detectArea(addr) {

if (addr.includes('신성동')) return '신성동';

if (addr.includes('도룡동')) return '도룡동';

if (addr.includes('죽동')) return '죽동';

if (addr.includes('어은동') || addr.includes('궁동')) return '어은동(궁동)';

if (addr.includes('전민동')) return '전민동';

return '기타';

}



function simplifyCategory(cat) {

if (cat.includes('한식')) return '한식';

if (cat.includes('중식')) return '중식';

if (cat.includes('일식')) return '일식';

if (cat.includes('양식') || cat.includes('이탈리아')) return '양식';

if (cat.includes('분식')) return '분식';

return '기타';

}



function filterAll() {

const term = dom.search.value.toLowerCase();

const filtered = cachedRestaurants.filter(r => {

const mSearch = r.name.toLowerCase().includes(term) || r.menu.toLowerCase().includes(term);

const mArea = currentArea === '전체' || r.area === currentArea;

const mCat = currentCat === '전체' || r.cat === currentCat;

let mPrice = true;

if (currentPriceRange === '1만원 미만') mPrice = r.price < 10000;

else if (currentPriceRange === '1~2만원') mPrice = r.price >= 10000 && r.price < 20000;

else if (currentPriceRange === '2~3만원') mPrice = r.price >= 20000 && r.price < 30000;

else if (currentPriceRange === '3만원 이상') mPrice = r.price >= 30000;

return mSearch && mArea && mCat && mPrice;

});

renderList(filtered);

dom.liveCount.textContent = filtered.length;

dom.resultCount.textContent = filtered.length;

}



function renderList(data) {

dom.list.innerHTML = data.length > 0 ? data.map(res => `

<div onclick="toggleCard(${res.id})" class="res-card bg-white border border-slate-100 p-4 cursor-pointer hover:shadow-lg ${activeId === res.id ? 'active ring-2 ring-blue-500 ring-offset-2' : ''}">

<div class="flex justify-between items-start">

<div class="space-y-1 flex-1">

<div class="flex gap-1 items-center">

<span class="text-[8px] font-black text-blue-500 bg-blue-50 px-1.5 py-0.5 rounded-full uppercase">${res.area}</span>

<span class="text-[8px] font-bold text-slate-300">| ${res.cat}</span>

</div>

<h4 class="font-bold text-slate-900 text-sm">${res.name}</h4>

<p class="text-[10px] text-slate-400 truncate">${res.menu}</p>

</div>

<div class="text-right shrink-0">

<div class="flex items-center gap-0.5 text-yellow-500 font-bold text-xs">

<span>★</span><span>${res.rating}</span>

</div>

<p class="text-[9px] text-slate-300 mt-1 italic">${res.id >= 1000 ? '실시간' : '검증완료'}</p>

</div>

</div>

${activeId === res.id ? `

<div class="mt-4 pt-4 border-t border-slate-100 flex gap-2 animate-in fade-in slide-in-from-top-1">

<a href="https://map.naver.com/v5/search/${encodeURIComponent(res.name)}" target="_blank" rel="noopener noreferrer" class="flex-1 bg-[#03C75A] text-white py-2 rounded-xl text-[10px] font-black text-center shadow-sm">네이버 지도에서 보기</a>

</div>

` : ''}

</div>

`).join('') : '<div class="col-span-full py-20 text-center text-slate-300 text-xs italic">조건에 맞는 식당이 리스트에 없습니다.<br>필터를 넓게 조정해 보세요!</div>';

}



window.toggleCard = (id) => { activeId = activeId === id ? null : id; filterAll(); };



function setLoading(isLoading) {

if (isLoading) {

dom.btnLoader.classList.remove('hidden');

dom.btnImg.classList.add('hidden');

dom.btnText.innerText = "늘프가 분석 중...";

} else {

dom.btnLoader.classList.add('hidden');

dom.btnImg.classList.remove('hidden');

dom.btnText.innerText = "오늘의 운명 맡기기";

}

}



function pickThreeForMaknae() {

const filteredPool = cachedRestaurants.filter(r => {

const matchArea = currentArea === '전체' || r.area === currentArea;

const matchCat = currentCat === '전체' || r.cat === currentCat;

return matchArea && matchCat;

});


if (filteredPool.length === 0) return;

const shuffled = [...filteredPool].sort(() => 0.5 - Math.random());

const picks = shuffled.slice(0, 3);

dom.recommendBox.classList.remove('hidden');

dom.recommendBox.innerHTML = picks.map((res, idx) => `

<div class="bg-white/20 backdrop-blur-md p-3 rounded-2xl border border-white/30 text-center pick-animate shadow-sm" style="animation-delay: ${idx * 0.1}s">

<p class="text-[9px] font-black text-blue-100 mb-1 tracking-widest">${idx + 1}순위</p>

<h4 class="text-xs font-bold truncate">${res.name}</h4>

<p class="text-[8px] opacity-80 truncate">${res.cat}</p>

</div>

`).join('');

window.scrollTo({ top: 0, behavior: 'smooth' });

}

</script>

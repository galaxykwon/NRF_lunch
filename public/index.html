<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NRF Foodie - 늘프의 점심 가이드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #F8FAFC; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .res-card { transition: all 0.2s ease; border-radius: 1.25rem; overflow: hidden; background: white; border: 1px solid #f1f5f9; }
        .res-card:active { transform: scale(0.97); }
        .review-box { background: #f8fafc; border-radius: 12px; padding: 12px; margin-top: 12px; border: 1px solid #f1f5f9; }
        .review-item { font-size: 11px; color: #64748b; margin-bottom: 4px; display: flex; gap: 4px; }
        .review-input-group { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; border-top: 1px solid #eee; padding-top: 10px; }
        .star-rating { display: flex; gap: 6px; color: #cbd5e1; cursor: pointer; font-size: 18px; }
        .star-rating .active { color: #facc15; }
        #add-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: white; width: 100%; max-width: 400px; border-radius: 2rem; padding: 2rem; }
    </style>
</head>
<body class="text-slate-800 pb-24">

    <header class="bg-white/90 backdrop-blur-md border-b border-slate-100 sticky top-0 z-50">
        <div class="max-w-md mx-auto px-5 h-16 flex items-center justify-between">
            <div class="flex items-center" onclick="location.reload()">
                <h1 class="text-sm font-black text-slate-900 tracking-tight">NRF <span class="text-blue-600">FOODIE MAP</span></h1>
            </div>
            <img src="https://nrf.re.kr/resources/img/contents/character/nulph_move.png" referrerpolicy="no-referrer" alt="늘프" class="h-10 w-auto object-contain">
        </div>
    </header>

    <main class="max-w-md mx-auto px-5 pt-5 space-y-6">
        <section class="bg-blue-600 rounded-[2.5rem] p-6 text-white shadow-2xl relative overflow-hidden">
            <div class="relative z-10">
                <h2 class="font-black text-lg mb-0.5 tracking-tight italic">오늘 점심 메뉴는 <br> 늘프가 골라드릴게요!</h2>
                <p class="text-xs text-blue-100 font-bold mb-6 opacity-90" id="day-theme-sub">데이터 로딩 중...</p>
                <div id="recommend-area" class="grid grid-cols-3 gap-2.5 mb-6 hidden"></div>
                <button onclick="getRandomPick()" class="w-full bg-white text-blue-600 py-4 rounded-2xl font-black text-sm shadow-xl flex items-center justify-center gap-2">
                    <img src="https://nrf.re.kr/resources/img/contents/character/nulph_intro.png" referrerpolicy="no-referrer" class="h-6 w-auto">
                    <span>운명의 메뉴 한 끼 뽑기</span>
                </button>
                <div class="flex justify-between items-center mt-4">
                    <p class="text-[10px] text-blue-200 font-medium" id="status-text">동기화 중...</p>
                    <button onclick="document.getElementById('add-modal').style.display='flex'" class="text-[10px] bg-white/20 text-white px-3 py-1.5 rounded-full font-bold border border-white/20">맛집 제보하기 +</button>
                </div>
            </div>
        </section>

        <section class="space-y-4">
            <div class="sticky top-[65px] z-40 bg-[#F8FAFC]/95 backdrop-blur-md py-2 space-y-3">
                <div class="flex gap-2 overflow-x-auto no-scrollbar" id="area-filter"></div>
                <div class="flex gap-2 overflow-x-auto no-scrollbar" id="price-filter"></div>
                <div class="flex gap-2 overflow-x-auto no-scrollbar" id="cat-filter"></div>
                <div class="px-1"><input type="text" id="search-input" oninput="filterAndRender()" placeholder="식당 이름 검색..." class="w-full p-3 bg-white border border-slate-200 rounded-xl text-xs outline-none shadow-sm"></div>
            </div>
            <div id="restaurant-list" class="space-y-4"></div>
        </section>

        <footer class="py-12 px-6 text-center space-y-4">
            <div class="bg-slate-100/50 p-5 rounded-3xl">
                <p class="text-[10px] text-slate-400 font-bold mb-2 uppercase tracking-tighter">⭐ 별점 부여 원리</p>
                <p class="text-[10px] text-slate-400 font-medium leading-relaxed">본 앱의 별점은 늘프 AI와 임직원분들이 직접 남겨주신 실시간 평점의 평균값으로 계산됩니다.</p>
            </div>
            <p class="text-[10px] text-slate-300 font-black tracking-[0.2em] uppercase">Designed by Galaxy</p>
        </footer>
    </main>

    <div id="add-modal" onclick="if(event.target === this) this.style.display='none'">
        <div class="modal-content shadow-2xl">
            <h3 class="font-black text-xl mb-4">맛집 제보하기 🍱</h3>
            <div class="space-y-3">
                <input type="text" id="new-res-name" placeholder="식당 이름" class="w-full p-4 bg-slate-50 rounded-2xl outline-none text-sm">
                <select id="new-res-area" class="w-full p-4 bg-slate-50 rounded-2xl outline-none text-sm appearance-none"><option value="">지역 선택</option><option value="신성동">신성동</option><option value="전민동">전민동</option><option value="도룡동">도룡동</option><option value="죽동">죽동</option><option value="어은/궁동/봉명">어은/궁동/봉명</option><option value="노은/반석">노은/반석</option><option value="만년/둔산">만년/둔산</option></select>
                <select id="new-res-cat" class="w-full p-4 bg-slate-50 rounded-2xl outline-none text-sm appearance-none"><option value="">카테고리 선택</option><option value="한식">한식</option><option value="중식">중식</option><option value="일식">일식</option><option value="양식">양식</option><option value="분식">분식</option></select>
                <button onclick="submitNewStore()" class="w-full bg-blue-600 text-white p-4 rounded-2xl font-black mt-2">지금 등록하기</button>
            </div>
        </div>
    </div>

    <script>
        const SB_URL = 'https://pbfgygmykizekzkzjrmo.supabase.co';
        const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBiZmd5Z215a2l6ZWt6a3pqcm1vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY5ODkwMzcsImV4cCI6MjA4MjU2NTAzN30.EbZbSDhDfO8IYZq1vguctih8T_7ChDGpfsubP_mhCuY';
        const supabaseClient = supabase.createClient(SB_URL, SB_KEY);

        let currentData = [];
        let fArea = '전체', fPrice = '전체', fCat = '전체';
        const areas = ['전체', '신성동', '도룡동', '죽동', '전민동', '어은/궁동/봉명', '노은/반석', '만년/둔산'];
        const prices = ['전체', '1만원 미만', '1~2만원', '2~3만원', '3만원 이상'];
        const cats = ['전체', '한식', '중식', '일식', '양식', '분식', '기타'];

        function setDayTheme() {
            const day = new Date().getDay();
            const themes = ["일요일! 🏠", "월요병 극복 고기데이 😊", "화!끈하게 화이팅! 🔥", "수~수하게 백반 어때요? 🍚", "목요일은 국물 요리! 🍲", "즐거운 금요일 맛집 탐방! 🚗", "행복한 토요일! 🍕"];
            document.getElementById('day-theme-sub').innerText = themes[day];
        }

        async function deepFetchData() {
            try {
                const response = await fetch(`/api/food`);
                const data = await response.json();
                if (data.items) {
                    currentData = data.items;
                    filterAndRender();
                    document.getElementById('status-text').innerText = `${currentData.length}개 식당 동기화`;
                }
            } catch (e) { document.getElementById('status-text').innerText = "로딩 오류"; }
        }

        async function submitNewStore() {
            const name = document.getElementById('new-res-name').value.trim();
            const address = document.getElementById('new-res-area').value;
            const category = document.getElementById('new-res-cat').value;
            if(!name || !address || !category) return alert("정보를 모두 입력해주세요!");
            const { error } = await supabaseClient.from('my_stores').insert([{ name, address, category }]);
            if(error) alert("등록 실패");
            else { alert("제보 감사합니다!"); location.reload(); }
        }

        function setStar(resName, rating) {
            const safeId = resName.replace(/\s/g, '');
            const stars = document.querySelectorAll(`#star-group-${safeId} span`);
            stars.forEach((s, idx) => {
                if (idx < rating) s.classList.add('active');
                else s.classList.remove('active');
            });
            window[`rating_${safeId}`] = rating;
        }

        async function saveReview(resName) {
            const safeId = resName.replace(/\s/g, '');
            const comment = document.getElementById(`input-${safeId}`).value.trim();
            const rating = window[`rating_${safeId}`] || 5;
            if(!comment) return alert("한줄평을 입력해주세요!");
            const { error } = await supabaseClient.from('reviews').insert([{ restaurant_name: resName, comment: comment, rating: rating }]);
            if(error) alert("등록 실패");
            else { alert("의견 반영 완료!"); location.reload(); }
        }

        async function filterAndRender() {
            const searchVal = document.getElementById('search-input').value.toLowerCase();
            const { data: reviews } = await supabaseClient.from('reviews').select('*');
            const filtered = currentData.map(item => {
                const myReviews = reviews?.filter(r => r.restaurant_name === item.name) || [];
                const avgRating = myReviews.length > 0 ? (myReviews.reduce((sum, r) => sum + r.rating, 0) / myReviews.length).toFixed(1)
                    : (item.isVip ? (4.6 + Math.random() * 0.3).toFixed(1) : (3.8 + Math.random() * 0.8).toFixed(1));
                return { ...item, area: detectAreaRaw(item.address), cat: simplifyCategory(item.category), realScore: avgRating, reviewCount: myReviews.length, reviews: myReviews };
            }).filter(i => {
                const mA = fArea === '전체' || i.area === fArea;
                const mC = fCat === '전체' || i.cat === fCat;
                const mS = i.name.toLowerCase().includes(searchVal);
                let mP = true;
                if (fPrice === '1만원 미만') mP = i.price < 10000;
                else if (fPrice === '1~2만원') mP = i.price >= 10000 && i.price < 20000;
                else if (fPrice === '2~3만원') mP = i.price >= 20000 && i.price < 30000;
                else if (fPrice === '3만원 이상') mP = i.price >= 30000;
                return mA && mC && mS && mP;
            }).sort((a,b) => b.realScore - a.realScore);
            renderList(filtered);
            renderFilters();
        }

        function renderList(list) {
            const container = document.getElementById('restaurant-list');
            container.innerHTML = list.map(item => {
                const safeId = item.name.replace(/\s/g, '');
                return `
                <div class="res-card p-5 mb-4 shadow-sm border border-slate-50">
                    <div class="flex justify-between items-center mb-3" onclick="window.open('https://map.naver.com/v5/search/${encodeURIComponent(item.name)}', '_blank')">
                        <div class="flex-1 pr-4">
                            <div class="flex gap-2 items-center mb-1">
                                <span class="text-[9px] font-black text-slate-400 uppercase tracking-widest">${item.area}</span>
                                ${item.isVip ? '<span class="text-[8px] bg-green-50 text-green-600 px-1.5 py-0.5 rounded-full font-bold">추천</span>' : ''}
                            </div>
                            <h3 class="font-black text-slate-900 text-base leading-tight">${item.name}</h3>
                            <p class="text-[11px] text-slate-400 truncate mt-0.5">${item.category}</p>
                        </div>
                        <div class="text-right shrink-0">
                            <div class="text-blue-600 font-black text-lg">★ ${item.realScore}</div>
                            <div class="text-[9px] text-slate-400 font-bold tracking-tighter">리뷰 ${item.reviewCount}개</div>
                        </div>
                    </div>
                    <div class="review-box">
                        <div class="review-items">${item.reviews.length > 0 ? item.reviews.slice(-2).map(r => `<div class="review-item"><span>💬</span><span>${r.comment} (★${r.rating})</span></div>`).join('') : '<div class="text-[10px] text-slate-300 italic">첫 리뷰를 남겨주세요!</div>'}</div>
                        <div class="review-input-group">
                            <div class="star-rating" id="star-group-${safeId}">
                                <span onclick="setStar('${item.name}', 1)">★</span><span onclick="setStar('${item.name}', 2)">★</span><span onclick="setStar('${item.name}', 3)">★</span><span onclick="setStar('${item.name}', 4)">★</span><span onclick="setStar('${item.name}', 5)">★</span>
                            </div>
                            <div class="flex gap-2"><input type="text" id="input-${safeId}" placeholder="한줄평..." class="flex-1 text-xs border-b border-slate-200 outline-none pb-1"><button onclick="saveReview('${item.name}')" class="text-blue-600 font-black text-[11px] shrink-0">등록</button></div>
                        </div>
                    </div>
                </div>
            `;}).join('');
        }

        function detectAreaRaw(addr) {
            if (!addr) return '기타';
            if (addr.includes('신성동') || addr.includes('자운동') || addr.includes('화암동')) return '신성동';
            if (addr.includes('도룡동')) return '도룡동';
            if (addr.includes('죽동')) return '죽동';
            if (addr.includes('전민동') || addr.includes('문지동')) return '전민동';
            if (addr.includes('어은동') || addr.includes('궁동') || addr.includes('봉명동')) return '어은/궁동/봉명';
            if (addr.includes('노은동') || addr.includes('반석동')) return '노은/반석';
            if (addr.includes('만년동') || addr.includes('둔산동')) return '만년/둔산';
            return '기타';
        }

        function simplifyCategory(cat) {
            if (!cat) return '기타';
            if(cat.includes('한식')) return '한식'; if(cat.includes('중식')) return '중식'; if(cat.includes('일식')) return '일식'; if(cat.includes('양식')) return '양식'; if(cat.includes('분식')) return '분식'; return '기타';
        }

        function renderFilters() {
            document.getElementById('area-filter').innerHTML = areas.map(a => `<button onclick="setFilter('area','${a}')" class="px-4 py-2 rounded-xl text-xs font-black whitespace-nowrap transition-all ${fArea === a ? 'bg-blue-600 text-white shadow-lg' : 'bg-white text-slate-400 border border-slate-100'}">${a}</button>`).join('');
            document.getElementById('price-filter').innerHTML = prices.map(p => `<button onclick="setFilter('price','${p}')" class="px-4 py-2 rounded-xl text-xs font-black whitespace-nowrap transition-all ${fPrice === p ? 'bg-blue-600 text-white shadow-lg' : 'bg-white text-slate-400 border border-slate-100'}">${p}</button>`).join('');
            document.getElementById('cat-filter').innerHTML = cats.map(c => `<button onclick="setFilter('cat','${c}')" class="px-4 py-2 rounded-xl text-xs font-black whitespace-nowrap transition-all ${fCat === c ? 'bg-blue-600 text-white shadow-lg' : 'bg-white text-slate-400 border border-slate-100'}">${c}</button>`).join('');
        }

        function setFilter(type, val) { if(type === 'area') fArea = val; if(type === 'price') fPrice = val; if(type === 'cat') fCat = val; filterAndRender(); }

        function getRandomPick() {
            const filtered = currentData.filter(i => (fArea === '전체' || detectAreaRaw(i.address) === fArea) && (fCat === '전체' || simplifyCategory(i.category) === fCat));
            if(filtered.length > 0) {
                const picks = [...filtered].sort(() => 0.5 - Math.random()).slice(0, 3);
                const recArea = document.getElementById('recommend-area');
                recArea.classList.remove('hidden');
                recArea.innerHTML = picks.map((p, i) => `<div class="bg-white/20 p-3 rounded-2xl border border-white/30 text-center shadow-lg" onclick="window.open('https://map.naver.com/v5/search/${encodeURIComponent(p.name)}', '_blank')"><div class="text-[9px] font-black text-blue-100 mb-1">${i+1} PICK</div><div class="font-black text-[11px] truncate text-white">${p.name}</div></div>`).join('');
            }
        }

        document.addEventListener('DOMContentLoaded', () => { setDayTheme(); deepFetchData(); });
    </script>
</body>
</html>

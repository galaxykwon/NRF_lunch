<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NRF Foodie Map</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #F8FAFC; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .pick-animate { animation: bounceIn 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55); }
        @keyframes bounceIn {
            0% { opacity: 0; transform: scale(0.3); }
            50% { opacity: 1; transform: scale(1.05); }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); }
        }
        .loading-spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 3px solid #fff;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .res-card { transition: all 0.2s ease; border-radius: 1.25rem; }
        .res-card:active { transform: scale(0.97); }
    </style>
</head>
<body class="text-slate-800 pb-24">

    <header class="bg-white/90 backdrop-blur-md border-b border-slate-100 sticky top-0 z-50">
        <div class="max-w-md mx-auto px-5 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2.5" onclick="location.reload()">
                <div class="bg-blue-600 text-white p-2 rounded-xl shadow-lg">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
                    </svg>
                </div>
                <div>
                    <h1 class="text-sm font-black text-slate-900 tracking-tight">NRF <span class="text-blue-600">FOODIE MAP</span></h1>
                    <p class="text-[10px] text-slate-400 font-bold uppercase tracking-tighter italic">NULPH Lunch Pick</p>
                </div>
            </div>
            <img src="https://nrf.re.kr/resources/img/contents/character/nulph_move.png" referrerpolicy="no-referrer" alt="늘프" class="h-10 w-auto">
        </div>
    </header>

    <main class="max-w-md mx-auto px-5 pt-5 space-y-6">

        <section class="bg-blue-600 rounded-[2.5rem] p-6 text-white shadow-2xl relative overflow-hidden">
            <div class="relative z-10">
                <div class="mb-6">
                    <h2 class="font-black text-xl mb-1 italic">오늘 점심은 늘프가 골라준다! 🦕</h2>
                    <p class="text-xs text-blue-100 font-medium" id="status-text">연구단지 전역의 데이터를 동기화 중...</p>
                </div>

                <div id="recommend-area" class="grid grid-cols-3 gap-2.5 mb-6 hidden"></div>

                <button onclick="getRandomPick()" id="action-btn" class="w-full bg-white text-blue-600 py-4 rounded-2xl font-black text-sm shadow-xl active:scale-95 transition-all flex items-center justify-center gap-2">
                    <img id="nulph-icon" src="https://nrf.re.kr/resources/img/contents/character/nulph_intro.png" referrerpolicy="no-referrer" alt="늘프" class="h-7 w-auto">
                    <span id="btn-label">이 중에서 운명의 한 끼 뽑기</span>
                </button>
            </div>
            <div class="absolute -bottom-10 -right-10 text-[10rem] opacity-10 rotate-12">🍱</div>
        </section>

        <section class="space-y-4">
            <div class="sticky top-[65px] z-40 bg-[#F8FAFC]/95 backdrop-blur-md py-2 space-y-3">
                <div class="flex flex-col gap-1.5">
                    <span class="text-[10px] font-black text-slate-400 uppercase px-1 tracking-widest">Neighborhood</span>
                    <div class="flex gap-2 overflow-x-auto no-scrollbar" id="area-filter"></div>
                </div>
                <div class="flex flex-col gap-1.5">
                    <span class="text-[10px] font-black text-slate-400 uppercase px-1 tracking-widest">Price Range</span>
                    <div class="flex gap-2 overflow-x-auto no-scrollbar" id="price-filter"></div>
                </div>
                <div class="flex flex-col gap-1.5">
                    <span class="text-[10px] font-black text-slate-400 uppercase px-1 tracking-widest">Category</span>
                    <div class="flex gap-2 overflow-x-auto no-scrollbar" id="cat-filter"></div>
                </div>
            </div>

            <div class="flex justify-between items-center px-1">
                <h3 class="font-black text-slate-900 text-sm italic tracking-tighter">REST-LIST <span class="text-blue-600 ml-1" id="count-badge">0</span></h3>
                <div class="flex items-center gap-1.5">
                    <span class="w-1.5 h-1.5 rounded-full bg-blue-500 animate-pulse"></span>
                    <span class="text-[10px] font-black text-blue-600 uppercase tracking-widest">Live Activeing</span>
                </div>
            </div>

            <div id="restaurant-list" class="space-y-4"></div>
        </section>
    </main>

    <script>
        const STATIC_DATA = [
            { id: 1, name: "숯골원냉면", area: "신성동", cat: "한식", menu: "평양냉면, 꿩냉면", price: 11000, score: 4.5, isRealTime: false },
            { id: 2, name: "천리집", area: "신성동", cat: "한식", menu: "순대국밥", price: 9000, score: 4.6, isRealTime: false }
        ];

        let currentData = [...STATIC_DATA];
        let fArea = '전체', fPrice = '전체', fCat = '전체';
        
        // [사용자 요청] UI 필터는 메인 동네 5개 + 기타로 제한하여 깔끔하게 유지
        const areas = ['전체', '신성동', '도룡동', '죽동', '어은동(궁동)', '전민동', '기타'];
        const prices = ['전체', '1만원 미만', '1~2만원', '2~3만원', '3만원 이상'];
        const cats = ['전체', '한식', '중식', '일식', '양식', '분식', '기타'];

        document.addEventListener('DOMContentLoaded', () => {
            renderFilters();
            deepFetchData();
        });

        async function deepFetchData() {
            const status = document.getElementById('status-text');
            try {
                const response = await fetch(`/api/food`);
                const data = await response.json();

                if (data.items && data.items.length > 0) {
                    const realItems = data.items.map((item, idx) => {
                        // 주소를 기반으로 지역 분류 (5개 외에는 모두 '기타'로 처리)
                        const rawArea = detectAreaRaw(item.roadAddress || item.address);
                        return {
                            id: Date.now() + idx,
                            name: item.title.replace(/<[^>]*>?/gm, ''),
                            area: rawArea, // 여기서 신성, 도룡, 죽동, 어은, 전민, 기타 중 하나가 할당됨
                            cat: item.category.split('>')[0] || '기타',
                            menu: item.category.replace(/>/g, ' '),
                            price: 12000,
                            score: (Math.random() * 0.4 + 4.3).toFixed(1),
                            isRealTime: true
                        };
                    });

                    currentData = [...realItems, ...STATIC_DATA];
                    filterAndRender();
                    status.innerText = `총 ${currentData.length}개의 맛집 정보를 동기화했습니다! 🦕`;
                }
            } catch (e) {
                status.innerText = "네트워크 문제로 로컬 데이터만 표시합니다.";
                filterAndRender();
            }
        }

        // [핵심 로직] 주소를 받아서 메인 5개 지역에 해당하지 않으면 모두 '기타'로 분류
        function detectAreaRaw(addr) {
            if (addr.includes('신성동')) return '신성동';
            if (addr.includes('도룡동')) return '도룡동';
            if (addr.includes('죽동')) return '죽동';
            if (addr.includes('전민동')) return '전민동';
            if (addr.includes('어은동') || addr.includes('궁동')) return '어은동(궁동)';
            // 그 외 장대동, 가정동, 노은동 등은 모두 UI상 '기타' 필터로 분류됨
            return '기타';
        }

        function renderFilters() {
            document.getElementById('area-filter').innerHTML = areas.map(a => `<button onclick="setFilter('area','${a}')" class="px-4 py-2 rounded-xl text-xs font-black whitespace-nowrap transition-all ${fArea === a ? 'bg-blue-600 text-white shadow-lg' : 'bg-white text-slate-400 border border-slate-100'}">${a}</button>`).join('');
            document.getElementById('price-filter').innerHTML = prices.map(p => `<button onclick="setFilter('price','${p}')" class="px-4 py-2 rounded-xl text-xs font-black whitespace-nowrap transition-all ${fPrice === p ? 'bg-blue-600 text-white shadow-lg' : 'bg-white text-slate-400 border border-slate-100'}">${p}</button>`).join('');
            document.getElementById('cat-filter').innerHTML = cats.map(c => `<button onclick="setFilter('cat','${c}')" class="px-4 py-2 rounded-xl text-xs font-black whitespace-nowrap transition-all ${fCat === c ? 'bg-blue-600 text-white shadow-lg' : 'bg-white text-slate-400 border border-slate-100'}">${c}</button>`).join('');
        }

        function setFilter(type, val) {
            if(type === 'area') fArea = val;
            if(type === 'price') fPrice = val;
            if(type === 'cat') fCat = val;
            renderFilters();
            filterAndRender();
        }

        function filterAndRender() {
            const filtered = currentData.filter(i => {
                const mA = fArea === '전체' || i.area === fArea;
                const mC = fCat === '전체' || i.cat === fCat;
                let mP = true;
                if(fPrice === '1만원 미만') mP = i.price < 10000;
                else if(fPrice === '1~2만원') mP = i.price >= 10000 && i.price < 20000;
                else if(fPrice === '2~3만원') mP = i.price >= 20000 && i.price < 30000;
                else if(fPrice === '3만원 이상') mP = i.price >= 30000;
                return mA && mC && mP;
            });
            renderList(filtered);
            return filtered;
        }

        function renderList(list) {
            const container = document.getElementById('restaurant-list');
            document.getElementById('count-badge').innerText = list.length;
            container.innerHTML = list.map(item => `
                <div class="res-card bg-white p-5 border border-slate-100 shadow-sm flex justify-between items-center" onclick="window.open('https://map.naver.com/v5/search/${encodeURIComponent(item.name)}', '_blank')">
                    <div class="space-y-1.5 flex-1 pr-4">
                        <div class="flex gap-2 items-center">
                            <span class="text-[9px] font-black text-slate-400 uppercase tracking-widest">${item.area}</span>
                            <span class="text-[9px] font-black text-blue-600 uppercase tracking-widest">#${item.cat}</span>
                        </div>
                        <h3 class="font-black text-slate-900 text-base leading-tight">${item.name}</h3>
                        <p class="text-[11px] text-slate-400 font-medium truncate">${item.menu}</p>
                    </div>
                    <div class="flex flex-col items-end shrink-0">
                        <div class="text-blue-600 font-black text-sm mb-1">★ ${item.score}</div>
                        <div class="px-2 py-0.5 rounded-md ${item.isRealTime ? 'bg-blue-50 text-blue-600' : 'bg-slate-50 text-slate-300'}">
                            <span class="text-[9px] font-black uppercase tracking-tighter">${item.isRealTime ? '⚡실시간' : '🏢데이터'}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function getRandomPick() {
            const pool = filterAndRender();
            const recArea = document.getElementById('recommend-area');
            if(pool.length > 0) {
                const shuffled = [...pool].sort(() => 0.5 - Math.random());
                const picks = shuffled.slice(0, 3);
                recArea.classList.remove('hidden');
                recArea.innerHTML = picks.map((p, i) => `
                    <div class="bg-white/20 p-3 rounded-2xl border border-white/30 text-center pick-animate shadow-lg" style="animation-delay: ${i * 0.1}s">
                        <div class="text-[9px] font-black text-blue-100 mb-1 tracking-widest">${i+1} PICK</div>
                        <div class="font-black text-[11px] truncate text-white">${p.name}</div>
                    </div>
                `).join('');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }
    </script>
</body>
</html>

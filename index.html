<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NRF Foodie - 15분 거리 확대판</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #F8FAFC; -webkit-tap-highlight-color: transparent; }
        .chart-container { 
            position: relative; 
            width: 100%; 
            height: 220px; 
        } 
        @media (min-width: 768px) { 
            .chart-container { height: 280px; } 
        }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #E2E8F0; border-radius: 10px; }
        
        .res-card { transition: all 0.2s ease-in-out; }
        .res-card.active { border-color: #3B82F6; background-color: #EFF6FF; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
    <!-- Chosen Palette: Warm Neutrals & NRF Blue. Expanded radius to 15 mins. -->
</head>
<body class="text-slate-800">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-1.5">
                <span class="text-xl">💎</span>
                <div class="flex flex-col">
                    <h1 class="text-base font-extrabold text-slate-900 leading-tight">NRF <span class="text-blue-600">Foodie map</span></h1>
                    <span class="text-[10px] text-slate-400 font-medium">오늘 점심 뭐먹지</span>
                </div>
            </div>
            <div class="text-[9px] font-bold text-blue-500 bg-blue-50 px-2 py-1 rounded-full uppercase">
                Radius 15min Expanded
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-4 space-y-6">

        <!-- Top Analysis Section -->
        <section>
            <div class="mb-4">
                <h2 class="text-lg font-bold text-slate-900">차량 15분 거리 맛집 분석</h2>
                <p class="text-xs text-slate-500">궁동, 죽동, 전민동까지 범위를 넓힌 가성비 가이드입니다.</p>
            </div>
            
            <div class="flex flex-col md:flex-row gap-4 items-stretch">
                <!-- Left: KPIs -->
                <div class="flex flex-row md:flex-col gap-3 w-full md:w-40 shrink-0">
                    <div class="flex-1 bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col justify-center">
                        <p class="text-[10px] font-bold text-slate-400 mb-1">평균 식비</p>
                        <div class="flex items-baseline gap-0.5">
                            <span class="text-xl font-black text-slate-900" id="stat-price">-</span>
                            <span class="text-xs font-medium text-slate-500">원</span>
                        </div>
                    </div>
                    <div class="flex-1 bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col justify-center">
                        <p class="text-[10px] font-bold text-slate-400 mb-1">평균 평점</p>
                        <div class="flex items-baseline gap-0.5">
                            <span class="text-xl font-black text-slate-900" id="stat-rating">-</span>
                            <span class="text-yellow-500 text-xs">★</span>
                        </div>
                    </div>
                </div>

                <!-- Right: Scatter Matrix -->
                <div class="flex-1 bg-white p-4 rounded-2xl shadow-sm border border-slate-100 min-w-0">
                    <h3 class="text-xs font-bold text-slate-500 mb-3 flex items-center gap-1">
                        <span>📊 가성비 매트릭스 (15분 반경)</span>
                    </h3>
                    <div class="chart-container">
                        <canvas id="scatterChart"></canvas>
                    </div>
                </div>
            </div>
        </section>

        <!-- List Section -->
        <section class="space-y-3">
            <!-- Sticky Filter & Search -->
            <div class="sticky top-[64px] z-40 bg-[#F8FAFC]/90 backdrop-blur-md py-2 -mx-1 px-1">
                <div class="flex flex-col gap-2">
                    <div class="flex gap-1.5 overflow-x-auto no-scrollbar pb-1" id="filter-bar">
                        <!-- Filters -->
                    </div>
                    <div class="relative">
                        <input type="text" id="search-box" placeholder="식당명이나 메뉴로 검색..." 
                            class="w-full pl-4 pr-10 py-3 bg-white border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none shadow-sm transition-all">
                        <span class="absolute right-4 top-1/2 -translate-y-1/2 opacity-30 text-lg">🔍</span>
                    </div>
                </div>
            </div>

            <!-- Restaurant Cards Container -->
            <div id="res-list" class="grid grid-cols-1 sm:grid-cols-2 gap-3 pb-8">
                <!-- List Items -->
            </div>
        </section>
    </main>

    <script>
        // --- DATASET: 15min Radius Expansion ---
        const RESTAURANTS = [
            // 한식 (15분 거리 포함)
            { id: 1, cat: "한식", name: "숯골원냉면", menu: "평양냉면, 꿩냉면", time: 4, rating: 4.3, price: 11000 },
            { id: 2, cat: "한식", name: "천리집", menu: "순대국밥, 모듬순대", time: 4, rating: 4.5, price: 9000 },
            { id: 3, cat: "한식", name: "유성옥 도룡점", menu: "한우곰탕, 수육", time: 6, rating: 4.4, price: 13000 },
            { id: 4, cat: "한식", name: "김판순김치찌개", menu: "김치찌개, 계란말이", time: 5, rating: 4.4, price: 10000 },
            { id: 5, cat: "한식", name: "광세족발 (전민동)", menu: "족발", time: 12, rating: 4.7, price: 18000 },
            { id: 6, cat: "한식", name: "신성집", menu: "석갈비, 갈비탕", time: 3, rating: 4.1, price: 15000 },
            { id: 7, cat: "한식", name: "산정거랑", menu: "추어탕", time: 7, rating: 4.3, price: 11000 },
            { id: 8, cat: "한식", name: "진도집", menu: "낙지볶음", time: 5, rating: 4.0, price: 12000 },
            { id: 9, cat: "한식", name: "흥남부두", menu: "밀면, 돼지불백", time: 4, rating: 4.2, price: 9000 },
            { id: 10, cat: "한식", name: "명성각 (죽동)", menu: "짬뽕, 탕수육", time: 11, rating: 4.3, price: 10000 },

            // 중식
            { id: 11, cat: "중식", name: "천안문", menu: "야끼짬뽕, 탕수육", time: 3, rating: 4.2, price: 9000 },
            { id: 12, cat: "중식", name: "낭만짬뽕", menu: "고기짬뽕", time: 4, rating: 4.4, price: 9500 },
            { id: 13, cat: "중식", name: "마피아짬뽕", menu: "매운짬뽕", time: 5, rating: 4.1, price: 9000 },
            { id: 14, cat: "중식", name: "리원 (죽동)", menu: "코스요리, 짜장", time: 10, rating: 4.2, price: 11000 },
            { id: 15, cat: "중식", name: "동방명주", menu: "사천탕면", time: 8, rating: 4.6, price: 12000 },
            { id: 16, cat: "중식", name: "짜장천국", menu: "가성비 짜장면", time: 3, rating: 3.8, price: 6000 },
            { id: 17, cat: "중식", name: "대동반점", menu: "볶음밥", time: 5, rating: 4.2, price: 8500 },
            { id: 18, cat: "중식", name: "홍콩반점", menu: "짬뽕, 탕수육", time: 6, rating: 4.0, price: 8000 },
            { id: 19, cat: "중식", name: "희락반점", menu: "유니짜장", time: 9, rating: 4.5, price: 9000 },
            { id: 20, cat: "중식", name: "차이나공 (노은동)", menu: "딤섬, 코스", time: 14, rating: 4.4, price: 15000 },

            // 일식
            { id: 21, cat: "일식", name: "토모카츠", menu: "돈카츠 전문", time: 5, rating: 4.6, price: 13000 },
            { id: 22, cat: "일식", name: "미요리", menu: "초밥, 사시미", time: 4, rating: 4.3, price: 18000 },
            { id: 23, cat: "일식", name: "겐로쿠우동", menu: "지도리우동", time: 6, rating: 4.4, price: 10000 },
            { id: 24, cat: "일식", name: "별리달리 (궁동)", menu: "돈까스, 덮밥", time: 13, rating: 4.5, price: 9000 },
            { id: 25, cat: "일식", name: "쿠마카츠", menu: "돈까스 정식", time: 4, rating: 4.1, price: 12000 },
            { id: 26, cat: "일식", name: "상무초밥", menu: "초밥 세트", time: 8, rating: 4.3, price: 15000 },
            { id: 27, cat: "일식", name: "스시호산", menu: "오마카세", time: 10, rating: 4.9, price: 80000 },
            { id: 28, cat: "일식", name: "킨토토", menu: "마제소바", time: 9, rating: 4.5, price: 11000 },
            { id: 29, cat: "일식", name: "미소야", menu: "돈카츠, 알밥", time: 3, rating: 3.9, price: 10500 },
            { id: 30, cat: "일식", name: "코코이찌방야", menu: "일본식 카레", time: 7, rating: 4.1, price: 11000 },

            // 양식
            { id: 31, cat: "양식", name: "리에바나", menu: "파스타, 스테이크", time: 5, rating: 4.4, price: 16000 },
            { id: 32, cat: "양식", name: "에이트 (궁동)", menu: "수제버거", time: 12, rating: 4.6, price: 11000 },
            { id: 33, cat: "양식", name: "더포", menu: "쌀국수, 월남쌈", time: 7, rating: 4.2, price: 12000 },
            { id: 34, cat: "양식", name: "라쿠치나", menu: "이탈리안", time: 8, rating: 4.6, price: 22000 },
            { id: 35, cat: "양식", name: "버거킹", menu: "와퍼", time: 6, rating: 4.0, price: 9500 },
            { id: 36, cat: "양식", name: "서브웨이", menu: "샌드위치", time: 5, rating: 4.1, price: 8500 },
            { id: 37, cat: "양식", name: "맘스터치", menu: "싸이버거", time: 3, rating: 4.0, price: 7500 },
            { id: 38, cat: "양식", name: "르몽드", menu: "브런치", time: 7, rating: 4.3, price: 15000 },
            { id: 39, cat: "양식", name: "보나베띠", menu: "파스타, 와인", time: 10, rating: 4.2, price: 19000 },
            { id: 40, cat: "양식", name: "파스타에스", menu: "가성비 파스타", time: 4, rating: 3.9, price: 11000 },

            // 분식
            { id: 41, cat: "분식", name: "고봉민김밥", menu: "돈까스김밥", time: 3, rating: 4.0, price: 5000 },
            { id: 42, cat: "분식", name: "신전떡볶이", menu: "매운 떡볶이", time: 4, rating: 4.1, price: 6000 },
            { id: 43, cat: "분식", name: "엽기떡볶이", menu: "엽떡", time: 6, rating: 4.2, price: 9000 },
            { id: 44, cat: "분식", name: "바르다김선생", menu: "김밥, 만두", time: 5, rating: 4.2, price: 7500 },
            { id: 45, cat: "분식", name: "떡반집 (둔산)", menu: "토스트, 떡볶이", time: 15, rating: 4.6, price: 5500 },
            { id: 46, cat: "분식", name: "얌샘김밥", menu: "모닥치기", time: 4, rating: 3.9, price: 8000 },
            { id: 47, cat: "분식", name: "김가네", menu: "분식 모듬", time: 3, rating: 3.8, price: 7500 },
            { id: 48, cat: "분식", name: "버무리", menu: "떡튀순", time: 5, rating: 4.0, price: 7000 },
            { id: 49, cat: "분식", name: "죠스떡볶이", menu: "떡볶이 세트", time: 7, rating: 4.0, price: 6500 },
            { id: 50, cat: "분식", name: "빨봉분식 (궁동)", menu: "치즈떡볶이", time: 13, rating: 4.1, price: 8500 }
        ];

        // --- STATE ---
        let currentFilter = 'All';
        let activeId = null;
        let scatterChart = null;

        const dom = {
            price: document.getElementById('stat-price'),
            rating: document.getElementById('stat-rating'),
            list: document.getElementById('res-list'),
            filters: document.getElementById('filter-bar'),
            search: document.getElementById('search-box')
        };

        // --- INIT ---
        document.addEventListener('DOMContentLoaded', () => {
            renderFilters();
            renderList(RESTAURANTS);
            updateStats(RESTAURANTS);
            initChart();

            dom.search.addEventListener('input', () => filterAll());
        });

        function filterAll() {
            const term = dom.search.value.toLowerCase();
            const filtered = RESTAURANTS.filter(r => {
                const matchSearch = r.name.toLowerCase().includes(term) || r.menu.toLowerCase().includes(term);
                const matchCat = currentFilter === 'All' || r.cat === currentFilter;
                return matchSearch && matchCat;
            });
            renderList(filtered);
            updateStats(filtered);
            updateChart(filtered);
        }

        function renderFilters() {
            const cats = ['All', '한식', '중식', '일식', '양식', '분식'];
            dom.filters.innerHTML = cats.map(c => `
                <button onclick="applyFilter('${c}')" class="px-5 py-2.5 text-xs font-black rounded-2xl border whitespace-nowrap transition-all 
                    ${currentFilter === c ? 'bg-blue-600 text-white border-blue-600 shadow-lg shadow-blue-100' : 'bg-white text-slate-400 border-slate-100'}">
                    ${c === 'All' ? '전체' : c}
                </button>
            `).join('');
        }

        window.applyFilter = (c) => {
            currentFilter = c;
            renderFilters();
            filterAll();
        };

        function renderList(data) {
            dom.list.innerHTML = data.map(res => `
                <div id="card-${res.id}" onclick="toggleCard(${res.id})" class="res-card bg-white border border-slate-100 rounded-3xl p-5 cursor-pointer hover:shadow-md ${activeId === res.id ? 'active' : ''}">
                    <div class="flex justify-between items-start">
                        <div class="space-y-1.5 flex-1">
                            <div class="flex items-center gap-2">
                                <span class="text-[9px] font-black text-blue-500 bg-blue-50 px-2 py-0.5 rounded-full uppercase">${res.cat}</span>
                                <span class="text-[9px] font-bold text-slate-400">차량 ${res.time}분</span>
                            </div>
                            <h4 class="font-bold text-slate-900 text-base">${res.name}</h4>
                            <p class="text-xs text-slate-400 truncate">${res.menu}</p>
                        </div>
                        <div class="text-right shrink-0">
                            <p class="text-sm font-black text-blue-600">${res.price.toLocaleString()}원</p>
                            <p class="text-xs font-bold text-yellow-500">★ ${res.rating}</p>
                        </div>
                    </div>
                    
                    <div id="detail-${res.id}" class="${activeId === res.id ? 'block' : 'hidden'} mt-5 pt-5 border-t border-slate-100 animate-in fade-in slide-in-from-top-1">
                        <div class="flex gap-2">
                            <a href="https://map.naver.com/p/search/${encodeURIComponent(res.name)}" target="_blank" 
                                class="flex-1 bg-[#03C75A] text-white py-3 rounded-2xl text-xs font-black text-center shadow-sm">네이버 지도</a>
                            <a href="https://map.kakao.com/link/search/${encodeURIComponent(res.name)}" target="_blank" 
                                class="flex-1 bg-[#FEE500] text-[#3A1D1D] py-3 rounded-2xl text-xs font-black text-center shadow-sm">카카오 맵</a>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        window.toggleCard = (id) => {
            if (activeId === id) {
                activeId = null;
            } else {
                activeId = id;
            }
            filterAll();
        };

        function updateStats(data) {
            if (data.length === 0) {
                dom.price.textContent = "0";
                dom.rating.textContent = "0.0";
                return;
            }
            const avgP = Math.round(data.reduce((a, b) => a + b.price, 0) / data.length);
            const avgR = (data.reduce((a, b) => a + b.rating, 0) / data.length).toFixed(1);
            dom.price.textContent = avgP.toLocaleString();
            dom.rating.textContent = avgR;
        }

        function initChart() {
            const ctx = document.getElementById('scatterChart').getContext('2d');
            scatterChart = new Chart(ctx, {
                type: 'scatter',
                data: {
                    datasets: [{
                        data: RESTAURANTS.map(r => ({ x: r.price, y: r.rating, name: r.name })),
                        backgroundColor: 'rgba(59, 130, 246, 0.5)',
                        borderColor: '#3B82F6',
                        borderWidth: 1,
                        pointRadius: 6,
                        pointHoverRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: { 
                            title: { display: true, text: '평균 가격(원)', font: { size: 9, weight: 'bold' } },
                            ticks: { font: { size: 8 } }
                        },
                        y: { 
                            title: { display: true, text: '평점', font: { size: 9, weight: 'bold' } },
                            min: 3.5, max: 5.0,
                            ticks: { font: { size: 8 } }
                        }
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: (ctx) => `${ctx.raw.name}: ${ctx.raw.x.toLocaleString()}원 / ★${ctx.raw.y}`
                            }
                        }
                    }
                }
            });
        }

        function updateChart(data) {
            if (!scatterChart) return;
            scatterChart.data.datasets[0].data = data.map(r => ({ x: r.price, y: r.rating, name: r.name }));
            scatterChart.update();
        }
    </script>
</body>
</html>

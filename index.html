<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NRF Foodie - 예산별 맞춤 가이드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #F8FAFC; -webkit-tap-highlight-color: transparent; }
        .chart-container { 
            position: relative; 
            width: 100%; 
            height: 200px; 
        } 
        @media (min-width: 768px) { 
            .chart-container { height: 260px; } 
        }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #E2E8F0; border-radius: 10px; }
        
        .res-card { transition: all 0.2s ease-in-out; }
        .res-card.active { border-color: #3B82F6; background-color: #EFF6FF; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
    <!-- Chosen Palette: Warm Neutrals & NRF Blue. Added Price Range Toggles. -->
</head>
<body class="text-slate-800">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-1.5">
                <span class="text-xl">💎</span>
                <div class="flex flex-col">
                    <h1 class="text-base font-extrabold text-slate-900 leading-tight">NRF <span class="text-blue-600">Foodie map</span></h1>
                    <span class="text-[10px] text-slate-400 font-medium">오늘 점심 뭐먹지</span>
                </div>
            </div>
            <div class="text-[9px] font-bold text-blue-500 bg-blue-50 px-2 py-1 rounded-full uppercase">
                Budget Filter Added
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-4 space-y-6">

        <!-- Analysis Section -->
        <section class="flex flex-col md:flex-row gap-4 items-stretch">
            <div class="flex flex-row md:flex-col gap-3 w-full md:w-40 shrink-0">
                <div class="flex-1 bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col justify-center text-center">
                    <p class="text-[10px] font-bold text-slate-400 mb-1">평균 식비</p>
                    <div class="flex items-baseline justify-center gap-0.5">
                        <span class="text-xl font-black text-slate-900" id="stat-price">-</span>
                        <span class="text-xs font-medium text-slate-500">원</span>
                    </div>
                </div>
                <div class="flex-1 bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col justify-center text-center">
                    <p class="text-[10px] font-bold text-slate-400 mb-1">평균 평점</p>
                    <div class="flex items-baseline justify-center gap-0.5">
                        <span class="text-xl font-black text-slate-900" id="stat-rating">-</span>
                        <span class="text-yellow-500 text-xs">★</span>
                    </div>
                </div>
            </div>

            <div class="flex-1 bg-white p-4 rounded-2xl shadow-sm border border-slate-100 min-w-0">
                <div class="chart-container">
                    <canvas id="scatterChart"></canvas>
                </div>
            </div>
        </section>

        <!-- Filter Section -->
        <section class="space-y-3">
            <div class="sticky top-[64px] z-40 bg-[#F8FAFC]/95 backdrop-blur-md py-2 -mx-1 px-1 space-y-3">
                <!-- Neighborhood Filter -->
                <div class="flex flex-col gap-1.5">
                    <p class="text-[10px] font-bold text-slate-400 px-1 uppercase tracking-wider">Neighborhood</p>
                    <div class="flex gap-1.5 overflow-x-auto no-scrollbar pb-1" id="area-bar">
                        <!-- Area Buttons -->
                    </div>
                </div>
                <!-- Price Filter -->
                <div class="flex flex-col gap-1.5">
                    <p class="text-[10px] font-bold text-slate-400 px-1 uppercase tracking-wider">Price Range</p>
                    <div class="flex gap-1.5 overflow-x-auto no-scrollbar pb-1" id="price-bar">
                        <!-- Price Range Buttons -->
                    </div>
                </div>
                <!-- Category Filter -->
                <div class="flex flex-col gap-1.5">
                    <p class="text-[10px] font-bold text-slate-400 px-1 uppercase tracking-wider">Category</p>
                    <div class="flex gap-1.5 overflow-x-auto no-scrollbar pb-1" id="filter-bar">
                        <!-- Category Buttons -->
                    </div>
                </div>
                <!-- Search -->
                <div class="relative">
                    <input type="text" id="search-box" placeholder="식당명이나 메뉴 검색..." 
                        class="w-full pl-4 pr-10 py-3 bg-white border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none shadow-sm">
                    <span class="absolute right-4 top-1/2 -translate-y-1/2 opacity-30">🔍</span>
                </div>
            </div>

            <!-- List -->
            <div id="res-list" class="grid grid-cols-1 sm:grid-cols-2 gap-3 pb-8">
                <!-- Items -->
            </div>
        </section>
    </main>

    <script>
        const AREAS = ['전체', '신성동', '도룡동', '어은동', '전민동', '기타'];
        const CATEGORIES = ['전체', '한식', '중식', '일식', '양식', '분식'];
        const PRICES = ['전체', '1만원 미만', '1~2만원', '2~3만원', '3만원 이상'];

        const RESTAURANTS = [
            // 신성동 (S)
            { id: 1, area: "신성동", cat: "한식", name: "숯골원냉면", menu: "평양냉면, 꿩냉면", time: 4, rating: 4.3, price: 11000 },
            { id: 2, area: "신성동", cat: "한식", name: "천리집", menu: "순대국밥, 모듬순대", time: 4, rating: 4.5, price: 9000 },
            { id: 4, area: "신성동", cat: "한식", name: "김판순김치찌개", menu: "김치찌개, 계란말이", time: 5, rating: 4.4, price: 10000 },
            { id: 5, area: "신성동", cat: "한식", name: "옹기칼국수", menu: "물총칼국수", time: 5, rating: 4.2, price: 8000 },
            { id: 21, area: "신성동", cat: "일식", name: "토모카츠", menu: "돈카츠 전문", time: 5, rating: 4.6, price: 13000 },
            { id: 22, area: "신성동", cat: "일식", name: "미요리", menu: "초밥, 사시미", time: 4, rating: 4.3, price: 18000 },
            { id: 12, area: "신성동", cat: "중식", name: "낭만짬뽕", menu: "고기짬뽕", time: 4, rating: 4.4, price: 9500 },
            { id: 42, area: "신성동", cat: "분식", name: "신전떡볶이", menu: "매운 떡볶이", time: 4, rating: 4.1, price: 6000 },
            
            // 도룡동 (D)
            { id: 3, area: "도룡동", cat: "한식", name: "유성옥 도룡점", menu: "한우곰탕, 수육", time: 6, rating: 4.4, price: 13000 },
            { id: 34, area: "도룡동", cat: "양식", name: "라쿠치나", menu: "이탈리안", time: 8, rating: 4.6, price: 22000 },
            { id: 27, area: "도룡동", cat: "일식", name: "스시호산", menu: "오마카세", time: 10, rating: 4.9, price: 80000 },
            { id: 38, area: "도룡동", cat: "양식", name: "르몽드", menu: "브런치", time: 7, rating: 4.3, price: 15000 },
            { id: 44, area: "도룡동", cat: "분식", name: "바르다김선생", menu: "김밥, 만두", time: 5, rating: 4.2, price: 7500 },
            { id: 15, area: "도룡동", cat: "중식", name: "동방명주", menu: "사천탕면", time: 8, rating: 4.6, price: 12000 },

            // 어은동/궁동 (A/G)
            { id: 32, area: "어은동", cat: "양식", name: "에이트 (궁동)", menu: "수제버거", time: 12, rating: 4.6, price: 11000 },
            { id: 24, area: "어은동", cat: "일식", name: "별리달리 (궁동)", menu: "돈까스, 덮밥", time: 13, rating: 4.5, price: 9000 },
            { id: 50, area: "어은동", cat: "분식", name: "빨봉분식 (궁동)", menu: "치즈떡볶이", time: 13, rating: 4.1, price: 8500 },
            { id: 49, area: "어은동", cat: "분식", name: "죠스떡볶이", menu: "떡볶이 세트", time: 7, rating: 4.0, price: 6500 },

            // 전민동 (J)
            { id: 55, area: "전민동", cat: "한식", name: "광세족발", menu: "족발", time: 12, rating: 4.7, price: 18000 },
            
            // 기타 (ETC - 죽동, 노은동 등)
            { id: 10, area: "기타", cat: "한식", name: "명성각 (죽동)", menu: "짬뽕, 탕수육", time: 11, rating: 4.3, price: 10000 },
            { id: 14, area: "기타", cat: "중식", name: "리원 (죽동)", menu: "코스요리, 짜장", time: 10, rating: 4.2, price: 11000 },
            { id: 20, area: "기타", cat: "중식", name: "차이나공 (노은동)", menu: "딤섬, 코스", time: 14, rating: 4.4, price: 15000 },
            { id: 45, area: "기타", cat: "분식", name: "떡반집 (둔산)", menu: "토스트, 떡볶이", time: 15, rating: 4.6, price: 5500 },
            { id: 100, area: "도룡동", cat: "한식", name: "대장금", menu: "한정식", time: 8, rating: 4.5, price: 25000 },
            { id: 101, area: "분식", cat: "분식", name: "고봉민김밥", menu: "돈까스김밥", time: 3, rating: 4.0, price: 5000 }
        ];

        let currentArea = '전체';
        let currentCat = '전체';
        let currentPriceRange = '전체';
        let activeId = null;
        let scatterChart = null;

        const dom = {
            price: document.getElementById('stat-price'),
            rating: document.getElementById('stat-rating'),
            list: document.getElementById('res-list'),
            areaBar: document.getElementById('area-bar'),
            priceBar: document.getElementById('price-bar'),
            filterBar: document.getElementById('filter-bar'),
            search: document.getElementById('search-box')
        };

        document.addEventListener('DOMContentLoaded', () => {
            renderFilterBars();
            filterAll();
            initChart();
            dom.search.addEventListener('input', () => filterAll());
        });

        function filterAll() {
            const term = dom.search.value.toLowerCase();
            const filtered = RESTAURANTS.filter(r => {
                const matchSearch = r.name.toLowerCase().includes(term) || r.menu.toLowerCase().includes(term);
                const matchArea = currentArea === '전체' || r.area === currentArea;
                const matchCat = currentCat === '전체' || r.cat === currentCat;
                
                let matchPrice = true;
                if (currentPriceRange === '1만원 미만') matchPrice = r.price < 10000;
                else if (currentPriceRange === '1~2만원') matchPrice = r.price >= 10000 && r.price < 20000;
                else if (currentPriceRange === '2~3만원') matchPrice = r.price >= 20000 && r.price < 30000;
                else if (currentPriceRange === '3만원 이상') matchPrice = r.price >= 30000;

                return matchSearch && matchArea && matchCat && matchPrice;
            });
            renderList(filtered);
            updateStats(filtered);
            if (scatterChart) updateChart(filtered);
        }

        function renderFilterBars() {
            // Area Buttons
            dom.areaBar.innerHTML = AREAS.map(a => `
                <button onclick="applyArea('${a}')" class="px-4 py-1.5 text-[11px] font-black rounded-xl border whitespace-nowrap transition-all 
                    ${currentArea === a ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-slate-400 border-slate-100'}">
                    ${a}
                </button>
            `).join('');

            // Price Range Buttons
            dom.priceBar.innerHTML = PRICES.map(p => `
                <button onclick="applyPrice('${p}')" class="px-4 py-1.5 text-[11px] font-black rounded-xl border whitespace-nowrap transition-all 
                    ${currentPriceRange === p ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-slate-400 border-slate-100'}">
                    ${p}
                </button>
            `).join('');

            // Category Buttons
            dom.filterBar.innerHTML = CATEGORIES.map(c => `
                <button onclick="applyCat('${c}')" class="px-4 py-1.5 text-[11px] font-black rounded-xl border whitespace-nowrap transition-all 
                    ${currentCat === c ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-slate-400 border-slate-100'}">
                    ${c}
                </button>
            `).join('');
        }

        window.applyArea = (a) => { currentArea = a; renderFilterBars(); filterAll(); };
        window.applyPrice = (p) => { currentPriceRange = p; renderFilterBars(); filterAll(); };
        window.applyCat = (c) => { currentCat = c; renderFilterBars(); filterAll(); };

        function renderList(data) {
            dom.list.innerHTML = data.length > 0 ? data.map(res => `
                <div onclick="toggleCard(${res.id})" class="res-card bg-white border border-slate-100 rounded-2xl p-4 cursor-pointer hover:shadow-md ${activeId === res.id ? 'active' : ''}">
                    <div class="flex justify-between items-start">
                        <div class="space-y-1 flex-1">
                            <div class="flex gap-1 items-center">
                                <span class="text-[8px] font-black text-blue-500 bg-blue-50 px-1.5 py-0.5 rounded-full uppercase">${res.area}</span>
                                <span class="text-[8px] font-bold text-slate-300">| ${res.cat}</span>
                            </div>
                            <h4 class="font-bold text-slate-900 text-sm">${res.name}</h4>
                            <p class="text-[10px] text-slate-400 truncate">${res.menu}</p>
                        </div>
                        <div class="text-right shrink-0">
                            <p class="text-xs font-black text-blue-600">${res.price.toLocaleString()}원</p>
                            <p class="text-[10px] font-bold text-yellow-500">★ ${res.rating}</p>
                        </div>
                    </div>
                    ${activeId === res.id ? `
                        <div class="mt-4 pt-4 border-t border-slate-100 flex gap-2 animate-in fade-in slide-in-from-top-1">
                            <a href="https://map.naver.com/p/search/${encodeURIComponent(res.name)}" target="_blank" class="flex-1 bg-[#03C75A] text-white py-2 rounded-xl text-[10px] font-black text-center">네이버</a>
                            <a href="https://map.kakao.com/link/search/${encodeURIComponent(res.name)}" target="_blank" class="flex-1 bg-[#FEE500] text-[#3A1D1D] py-2 rounded-xl text-[10px] font-black text-center">카카오</a>
                        </div>
                    ` : ''}
                </div>
            `).join('') : '<div class="col-span-full py-10 text-center text-slate-300 text-xs">해당 조건의 식당이 없습니다.</div>';
        }

        window.toggleCard = (id) => { activeId = activeId === id ? null : id; filterAll(); };

        function updateStats(data) {
            if (data.length === 0) { dom.price.textContent = "0"; dom.rating.textContent = "0.0"; return; }
            const avgP = Math.round(data.reduce((a, b) => a + b.price, 0) / data.length);
            const avgR = (data.reduce((a, b) => a + b.rating, 0) / data.length).toFixed(1);
            dom.price.textContent = avgP.toLocaleString();
            dom.rating.textContent = avgR;
        }

        function initChart() {
            const ctx = document.getElementById('scatterChart').getContext('2d');
            scatterChart = new Chart(ctx, {
                type: 'scatter',
                data: {
                    datasets: [{
                        data: RESTAURANTS.map(r => ({ x: r.price, y: r.rating, name: r.name })),
                        backgroundColor: 'rgba(59, 130, 246, 0.4)',
                        borderColor: '#3B82F6',
                        borderWidth: 1,
                        pointRadius: 5
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: { title: { display: true, text: '가격', font: { size: 8 } }, ticks: { font: { size: 8 } } },
                        y: { title: { display: true, text: '평점', font: { size: 8 } }, min: 3.5, max: 5.0, ticks: { font: { size: 8 } } }
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }

        function updateChart(data) {
            scatterChart.data.datasets[0].data = data.map(r => ({ x: r.price, y: r.rating, name: r.name }));
            scatterChart.update();
        }
    </script>
</body>
</html>

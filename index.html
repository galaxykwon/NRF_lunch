<html lang="ko">

    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #F8FAFC; -webkit-tap-highlight-color: transparent; }
        .chart-container { 
            position: relative; 
            width: 100%; 
            height: 200px; 
        } 
        @media (min-width: 768px) { 
            .chart-container { height: 260px; } 
        }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #E2E8F0; border-radius: 10px; }
        
        .res-card { transition: all 0.2s ease-in-out; }
        .res-card.active { border-color: #3B82F6; background-color: #EFF6FF; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>

                    <p class="text-[10px] font-bold text-slate-400 mb-1 tracking-tighter">평균 식비</p>
                    <div class="flex items-baseline justify-center gap-0.5">
                        <span class="text-xl font-black text-slate-900" id="stat-price">-</span>
                        <span class="text-[10px] font-medium text-slate-500">원</span>
                    </div>
                </div>
                <div class="flex-1 bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col justify-center text-center">
                    <p class="text-[10px] font-bold text-slate-400 mb-1 tracking-tighter">평균 평점</p>
                    <div class="flex items-baseline justify-center gap-0.5">
                        <span class="text-xl font-black text-slate-900" id="stat-rating">-</span>
                        <span class="text-yellow-500 text-xs">★</span>
                    </div>
                </div>
            </div>

            <div class="flex-1 bg-white p-4 rounded-2xl shadow-sm border border-slate-100 min-w-0">
                <div class="chart-container">

                </div>
            </div>

                </div>
                <div class="flex flex-col gap-1">

                </div>

                    <div class="flex gap-1.5 overflow-x-auto no-scrollbar pb-1" id="filter-bar"></div>

            price: document.getElementById('stat-price'),
            rating: document.getElementById('stat-rating'),
            list: document.getElementById('res-list'),
            areaBar: document.getElementById('area-bar'),
            priceBar: document.getElementById('price-bar'),
            filterBar: document.getElementById('filter-bar'),
            search: document.getElementById('search-box'),
            resCount: document.getElementById('result-count')
        };

        document.addEventListener('DOMContentLoaded', () => {
            renderFilterBars();
            filterAll();
            initChart();
            dom.search.addEventListener('input', () => filterAll());
        });

        function filterAll() {
            const term = dom.search.value.toLowerCase();
            const filtered = RESTAURANTS.filter(r => {
                const mSearch = r.name.toLowerCase().includes(term) || r.menu.toLowerCase().includes(term);
                const mArea = currentArea === '전체' || r.area === currentArea;
                const mCat = currentCat === '전체' || r.cat === currentCat;
                let mPrice = true;
                if (currentPriceRange === '1만원 미만') mPrice = r.price < 10000;
                else if (currentPriceRange === '1~2만원') mPrice = r.price >= 10000 && r.price < 20000;
                else if (currentPriceRange === '2~3만원') mPrice = r.price >= 20000 && r.price < 30000;
                else if (currentPriceRange === '3만원 이상') mPrice = r.price >= 30000;
                return mSearch && mArea && mCat && mPrice;
            });
            dom.resCount.textContent = filtered.length;
            renderList(filtered);
            updateStats(filtered);
            if (scatterChart) updateChart(filtered);
        }

        function renderFilterBars() {
            dom.areaBar.innerHTML = AREAS.map(a => `<button onclick="applyArea('${a}')" class="px-4 py-1.5 text-[10px] font-black rounded-xl border whitespace-nowrap transition-all ${currentArea === a ? 'bg-blue-600 text-white border-blue-600 shadow-md' : 'bg-white text-slate-400 border-slate-100'}">${a}</button>`).join('');
            dom.priceBar.innerHTML = PRICES.map(p => `<button onclick="applyPrice('${p}')" class="px-4 py-1.5 text-[10px] font-black rounded-xl border whitespace-nowrap transition-all ${currentPriceRange === p ? 'bg-blue-600 text-white border-blue-600 shadow-md' : 'bg-white text-slate-400 border-slate-100'}">${p}</button>`).join('');
            dom.filterBar.innerHTML = CATEGORIES.map(c => `<button onclick="applyCat('${c}')" class="px-4 py-1.5 text-[10px] font-black rounded-xl border whitespace-nowrap transition-all ${currentCat === c ? 'bg-blue-600 text-white border-blue-600 shadow-md' : 'bg-white text-slate-400 border-slate-100'}">${c}</button>`).join('');
        }

        window.applyArea = (a) => { currentArea = a; renderFilterBars(); filterAll(); };
        window.applyPrice = (p) => { currentPriceRange = p; renderFilterBars(); filterAll(); };
        window.applyCat = (c) => { currentCat = c; renderFilterBars(); filterAll(); };

        function renderList(data) {
            dom.list.innerHTML = data.length > 0 ? data.map(res => `
                <div onclick="toggleCard(${res.id})" class="res-card bg-white border border-slate-100 rounded-2xl p-4 cursor-pointer hover:shadow-md ${activeId === res.id ? 'active ring-2 ring-blue-500 ring-offset-2' : ''}">

                                <span class="text-[8px] font-bold text-slate-300">| ${res.cat}</span>
                            </div>
                            <h4 class="font-bold text-slate-900 text-sm">${res.name}</h4>
                            <p class="text-[10px] text-slate-400 truncate">${res.menu}</p>
                        </div>
                        <div class="text-right shrink-0">
                            <p class="text-xs font-black text-blue-600">${res.price.toLocaleString()}원</p>
                            <p class="text-[10px] font-bold text-yellow-500">★ ${res.rating}</p>
                        </div>
                    </div>
                    ${activeId === res.id ? `
                        <div class="mt-4 pt-4 border-t border-slate-100 flex gap-2 animate-in fade-in slide-in-from-top-1">
                            <a href="https://map.naver.com/p/search/${encodeURIComponent(res.name)}" target="_blank" class="flex-1 bg-[#03C75A] text-white py-2 rounded-xl text-[10px] font-black text-center shadow-sm">네이버 지도</a>
                            <a href="https://map.kakao.com/link/search/${encodeURIComponent(res.name)}" target="_blank" class="flex-1 bg-[#FEE500] text-[#3A1D1D] py-2 rounded-xl text-[10px] font-black text-center shadow-sm">카카오 맵</a>
                        </div>
                    ` : ''}
                </div>
            `).join('') : '<div class="col-span-full py-20 text-center text-slate-300 text-xs italic">실존 식당 목록 중 조건에 맞는 곳이 없습니다.<br>다른 필터를 조합해 보세요!</div>';
        }

        window.toggleCard = (id) => { activeId = activeId === id ? null : id; filterAll(); };

        function updateStats(data) {
            if (data.length === 0) { dom.price.textContent = "0"; dom.rating.textContent = "0.0"; return; }
            const avgP = Math.round(data.reduce((a, b) => a + b.price, 0) / data.length);
            const avgR = (data.reduce((a, b) => a + b.rating, 0) / data.length).toFixed(1);
            dom.price.textContent = avgP.toLocaleString();
            dom.rating.textContent = avgR;
        }

        function initChart() {
            const ctx = document.getElementById('scatterChart').getContext('2d');
            scatterChart = new Chart(ctx, {
                type: 'scatter',
                data: {
                    datasets: [{
                        data: RESTAURANTS.map(r => ({ x: r.price, y: r.rating, name: r.name })),
                        backgroundColor: 'rgba(59, 130, 246, 0.4)',
                        borderColor: '#3B82F6',
                        borderWidth: 1,
                        pointRadius: 4,
                        pointHoverRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: { title: { display: true, text: '가격(원)', font: { size: 9, weight: 'bold' } }, ticks: { font: { size: 8 } }, grid: { color: '#F1F5F9' } },
                        y: { title: { display: true, text: '평점', font: { size: 9, weight: 'bold' } }, min: 3.5, max: 5.0, ticks: { font: { size: 8 } }, grid: { color: '#F1F5F9' } }
                    },
                    plugins: { legend: { display: false }, tooltip: { callbacks: { label: (ctx) => `${ctx.raw.name}: ${ctx.raw.x.toLocaleString()}원 / ★${ctx.raw.y}` } } }
                }
            });
        }

        function updateChart(data) {
            scatterChart.data.datasets[0].data = data.map(r => ({ x: r.price, y: r.rating, name: r.name }));
            scatterChart.update();
        }
    </script>
</body>
</html>
